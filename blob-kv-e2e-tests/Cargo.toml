[package]
name = "blob-kv-e2e-tests"
version.workspace = true
edition.workspace = true
publish = false

# These binary targets point at the real server and CLI sources. The names are
# unique to this package so they do not collide with the original binaries when
# the whole workspace is built. Defining them here also means
# `cargo test -p blob-kv-e2e-tests` builds them from the current sources.
[[bin]]
name = "blob-kv-server-e2e"
path = "../blob-kv-server/src/main.rs"
test = false

[[bin]]
name = "blob-kv-cli-e2e"
path = "../blob-kv-cli/src/main.rs"
test = false

[dependencies]
blob-kv-client = { path = "../blob-kv-client" }
blob-kv-engine = { path = "../blob-kv-engine" }
blob-kv-protocol = { path = "../blob-kv-protocol" }
chumsky = "0.14.2"
clap = { version = "4.6.9", features = ["derive", "env"] }
reedline = "0.53.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
libc = "0.2.191"
predicates = "3.1.4"
tempfile = "3.27.0"
